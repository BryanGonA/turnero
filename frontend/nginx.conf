server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Assets con hash: caché agresiva
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # index.html NUNCA se cachea: es el manifiesto que referencia los assets
  # versionados por hash. Sin esto, un navegador con caché vieja no ve
  # ningún cambio visual tras un redespliegue.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA: cualquier ruta del frontend (/login, /admin, /advisor, /screen, /marketing)
  # devuelve index.html y React Router resuelve del lado del cliente.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
